default:
  tags:
    - docker

variables:
  GITLAB_TOKEN: $GL_TOKEN

es-lint:
  stage: test
  image: node:22.14.0-alpine3.21
  before_script:
    - npm ci
  script:
    - npm run es-lint

include:
  # 1: include the component
  - component: $CI_SERVER_FQDN/to-be-continuous/semantic-release/gitlab-ci-semrel@3.13.0
    # 2: set/override component inputs
    inputs:
      changelog-enabled: true # ⚠ this is only an example
      commit-spec: conventionalcommits
  - component: $CI_SERVER_FQDN/to-be-continuous/pre-commit/gitlab-ci-pre-commit@1.2.0
